services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://admin:${MONGO_PASSWORD}@mongo:27017/votingsystem?replicaSet=rs0&authSource=admin
      - NODE_ENV=production
    networks:
      - app-network
    # Don't expose ports if nginx proxies to it
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    networks:
      - app-network
    ports:
      - "3080:80"
    volumes:
      - /home/azureuser/voting.jeinsat.com:/etc/letsencrypt:ro
    env_file:
      - ./client/.env
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:8.0
    # ❌ REMOVE THIS ENTIRE SECTION in production:
    # ports:
    #   - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - app-network
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: |
        mongosh -u admin -p ${MONGO_PASSWORD} --authenticationDatabase admin --quiet --eval "
          try {
            var status = rs.status();
            if (status.myState === 1) { quit(0); }
            else { quit(1); }
          } catch (e) {
            if (e.message.includes('no replset config')) {
              rs.initiate({
                _id: 'rs0',
                members: [{ _id: 0, host: 'mongo:27017' }]
              });
              quit(0);
            } else { quit(1); }
          }
        "
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
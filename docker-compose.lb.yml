services:
  # Backend Instance 1
  backend1:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/votingsystem?replicaSet=rs0
      - INSTANCE_NAME=backend1
    networks:
      - app-network
    # Don't expose ports externally - only through nginx-lb
    expose:
      - "3000"
    volumes:
      - dist_data:/app/client/dist
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Backend Instance 2 - Load Balanced
  backend2:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/votingsystem?replicaSet=rs0
      - INSTANCE_NAME=backend2
    networks:
      - app-network
    # Don't expose ports externally - only through nginx-lb
    expose:
      - "3001"
    volumes:
      - dist_data:/app/client/dist
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Load Balancer
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-loadbalancer
    ports:
      - "3000:80"  # External port 3000 maps to nginx port 80
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - backend1
      - backend2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    networks:
      - app-network
    ports:
      - "3080:80"  # Frontend on port 3080
    volumes:
      - dist_data:/app/client/dist
      - /home/azureuser/voting.jeinsat.com:/etc/letsencrypt
    env_file:
      - ./client/.env
    depends_on:
      - nginx-lb
    restart: unless-stopped

  # MongoDB
  mongo:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    networks:
      - app-network
    volumes:
      - "mongo_data:/data/db"
      - "mongo_config:/data/configdb"
    restart: unless-stopped
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try {
            var status = rs.status();
            if (status.myState === 1) {
              print('PRIMARY');
              quit(0);
            } else {
              print('Not PRIMARY yet');
              quit(1);
            }
          } catch (e) {
            if (e.message.includes('no replset config')) {
              print('Initializing replica set...');
              rs.initiate({
                _id: 'rs0',
                members: [{ _id: 0, host: 'mongo:27017' }]
              });
              quit(0);
            } else {
              print('Error: ' + e.message);
              quit(1);
            }
          }
        "
      interval: 10s
      timeout: 10s
      start_period: 0s
      retries: 30

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
  dist_data:


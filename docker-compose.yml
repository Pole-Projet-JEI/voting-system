services:
  backend1:
    deploy:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://admin:${MONGO_PASSWORD}@mongo:27017/votingsystem?replicaSet=rs0&authSource=admin
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    networks:
      - app-network # Connect MongoDB to this network
    ports:
      - "3080:80" # Use port 3080 for the frontend
    env_file:
      - ./client/.env
    depends_on:
      backend1:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    networks:
      - app-network
    volumes:
      - "mongo_data:/data/db"
      - "mongo_config:/data/configdb"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: |
        mongosh -u admin -p ${MONGO_PASSWORD} --authenticationDatabase admin --quiet --eval "
          try {
            var status = rs.status();
            if (status.myState === 1) {
              print('PRIMARY');
              quit(0);
            } else {
              print('Not PRIMARY yet');
              quit(1);
            }
          } catch (e) {
            if (e.message.includes('no replset config')) {
              print('Initializing replica set...');
              rs.initiate({
                _id: 'rs0',
                members: [{ _id: 0, host: 'mongo:27017' }]
              });
              quit(0);
            } else {
              print('Error: ' + e.message);
              quit(1);
            }
          }
        "
      interval: 10s
      timeout: 10s
      start_period: 5s
      retries: 30

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:

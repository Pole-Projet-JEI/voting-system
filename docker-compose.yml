services:
  backend1:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/votingsystem?replicaSet=rs0
    networks:
      - app-network
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    networks:
      - app-network
    ports:
      - "127.0.0.1:3080:80"
    env_file:
      - ./client/.env
    depends_on:
      backend1:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo@sha256:f4d54619262ae3bc6a0a8efbebcef970b87b8ad70697479a75ce308a6f400158
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    networks:
      - app-network
    volumes:
      - "mongo_data:/data/db"
      - "mongo_config:/data/configdb"
    restart: unless-stopped
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try {
            var status = rs.status();
            if (status.myState === 1) {
              quit(0);
            } else {
              quit(1);
            }
          } catch (e) {
            if (e.message.includes('no replset config')) {
              rs.initiate({
                _id: 'rs0',
                members: [{ _id: 0, host: 'mongo:27017' }]
              });
              quit(0);
            } else {
              quit(1);
            }
          }
        " || exit 1
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
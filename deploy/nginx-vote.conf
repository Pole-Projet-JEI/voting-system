# Host nginx on the event server: /etc/nginx/sites-available/vote (see deploy/README.md).
# certbot --nginx adds the HTTPS part. Sized for ~2000 phones each holding a live-update stream:
# /etc/nginx/nginx.conf also gets worker_rlimit_nofile 65535 and worker_connections 16384.

upstream voting_api {
    server 127.0.0.1:3000;
    keepalive 64;
    keepalive_timeout 4s; # below Node's 5 s, so nginx never reuses a connection Node is closing
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vote.jeinsat.com;
    client_max_body_size 64k;

    # API straight to the backend, skipping the frontend container's nginx (one hop less per stream).
    location /api/ {
        proxy_pass http://voting_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwritten, not appended: this is the edge, so the backend's rate limits see the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live updates (/api/sendvote): pass every event through at once and keep the stream open.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

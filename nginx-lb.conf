events {
    worker_connections 4096;
    use epoll;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Upstream backend servers with health checks
    upstream backend_servers {
        # Load balancing algorithm
        least_conn;  # Route to server with least connections
        
        # Backend instances
        server backend1:3000 max_fails=3 fail_timeout=30s weight=1;
        server backend2:3001 max_fails=3 fail_timeout=30s weight=1;
        
        # Keep connections alive
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 100;
        
        # Note: For SSE sticky sessions, uncomment below:
        # ip_hash;  # Same client always goes to same backend
    }

    # Connection upgrade mapping (for WebSocket/SSE)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Rate limiting zones (increased for load testing)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=500r/s;
    limit_req_zone $binary_remote_addr zone=vote_limit:10m rate=500r/s;

    server {
        listen 80;
        server_name _;
        
        # Large timeouts for SSE connections
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # Client body size
        client_max_body_size 10M;
        
        # API endpoints with load balancing
        location /api/ {
            # Rate limiting (burst allows temporary spikes)
            limit_req zone=api_limit burst=200 nodelay;
            
            # Proxy to backend pool
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            # Headers for proper forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Keep-alive connections to upstream
            proxy_set_header Connection "";
            
            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            
            # CORS headers (if needed)
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials true always;
            
            # Handle preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
        
        # SSE endpoint with special handling
        location /api/sendvote {
            # No rate limiting for SSE connections
            
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            # SSE headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Critical for SSE
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;  # 24 hours
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
            
            # SSE specific headers
            add_header Cache-Control 'no-cache';
            add_header X-Accel-Buffering 'no';
        }
        
        # Voting endpoint with rate limiting
        location ~ ^/api/vote/ {
            limit_req zone=vote_limit burst=20 nodelay;
            
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }
        
        # Health check endpoint (bypass load balancing)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Nginx status (for monitoring)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker networks
            deny all;
        }
    }
}

